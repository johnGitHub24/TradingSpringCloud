server:
  port: 8082

spring:
  application:
    name: order-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
startup:
  info:
    enabled: true
    project-name: TradingSpringCloud Order
    frontend: none
    h2: false
    api-docs: false
    probe: true
    extra-paths: /api/v1/orders
