<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Spring Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Trading Spring Cloud</h1>
        <div>
            <a href="/guide.html" class="btn btn-sm btn-outline-info me-1" target="_blank">教學</a>
            <a href="/swagger-ui.html" class="btn btn-sm btn-outline-secondary" target="_blank">Swagger</a>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">OpenFeign 聚合</div>
                <div class="card-body">
                    <button class="btn btn-primary" @click="loadDashboard" :disabled="loading">GET /api/v1/dashboard</button>
                    <pre class="small bg-light p-2 mt-2 mb-0">{{ dashboard }}</pre>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Gateway 代理 — Loop</div>
                <div class="card-body">
                    <button class="btn btn-outline-primary" @click="loadLoopProxy" :disabled="loading">/proxy/loop/trust</button>
                    <pre class="small bg-light p-2 mt-2 mb-0">{{ loopProxy }}</pre>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Gateway 代理 — Order</div>
                <div class="card-body">
                    <button class="btn btn-outline-primary" @click="loadOrderProxy" :disabled="loading">/proxy/orders/1001</button>
                    <pre class="small bg-light p-2 mt-2 mb-0">{{ orderProxy }}</pre>
                </div>
            </div>
        </div>
    </div>
    <div class="alert alert-info mt-3 mb-0">需先啟動 loop-service:8081、order-service:8082、gateway:8080</div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
